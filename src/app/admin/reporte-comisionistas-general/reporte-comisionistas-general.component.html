<div class="container">
  <div id="reporte" class="row">
    <div class="col-sm">
      <h4 (click)="calcDepartament('Acuario')">Reportes General Comision</h4>
      <div class="row">
        <div class="col-sm">
          <label for="date">Filtar por fecha</label>
          <input
            id="date"
            class="form-control"
            type="date"
            #dates
            [(ngModel)]="date"
            (change)="search()"
          />
        </div>
        <div class="col-sm">
          <label for="date">Filtar por fecha</label>
          <input
            id="date"
            class="form-control"
            type="date"
            #dates2
            [(ngModel)]="date2"
            (change)="search()"
          />
        </div>

        <div class="col-sm">
          <br />
          <button
            style="margin-top: 8px"
            [disabled]="!seller && !date"
            class="btn-success btn"
            (click)="generateReport()"
          >
            Generar Reporte
          </button>
          &nbsp;
          <button
            style="margin-top: 8px"
            [disabled]="!seller && !date"
            class="btn-success btn"
            (click)="generateReportExcel()"
          >
            Generar Excel
          </button>
        </div>
      </div>

       
      <hr />
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Comisionista</th>
            <th>Total Acumulado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let comisionistaTotal of comisionistasTotales">
            <td>{{ comisionistaTotal.comisionista }}</td>
            <td>{{ comisionistaTotal.valor }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
