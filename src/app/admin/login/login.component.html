<div class="container" >
  <div class="container pt-3">
    <br><br><br>
    <div class="row justify-content-sm-center">
     
      <div class="col-sm-10 col-md-6">
        <div class="card border-info">
          <div class="card-header" style="text-align: center;">Inicio de sesión</div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-4 text-center">
                <img src="./../../../assets/register_icon.png">
              </div>
              <div class="col-md-8">

                <input type="text" class="form-control mb-2" placeholder="Email" #userEmail required autofocus>
                <input type="password" class="form-control mb-2" placeholder="Password" #userPassword required>
                <button class="btn btn-lg btn-primary btn-block mb-1"
                  (click)="authService.login(userEmail.value, userPassword.value)">Iniciar sesión</button>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
